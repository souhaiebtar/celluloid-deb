name: build packages

# Builds .deb packages for every supported suite on a schedule and on demand.
# Tag pushes attach the resulting packages to a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # weekly: picks up new upstream Celluloid releases without a commit
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      suites:
        description: "Space-separated suites (default: all)"
        required: false
        default: ""
      version:
        description: "Pin an upstream version, e.g. 0.30 (default: resolve)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, sid]

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg2 tar python3

      # The build dependencies image is the expensive part of a run (~2.5 min of
      # apt per suite). Cache it between runs, keyed on the recipe that
      # produces it: the Dockerfile template, the dependency list and the
      # suite table. A change to any of those correctly misses the cache.
      - name: Compute dependency-image cache key
        id: image-key
        run: |
          key=$(cat packaging/Dockerfile.build.in suites.toml \
                  lib/container.sh | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore cached dependency image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/celluloid-image-cache
          key: celluloid-image-${{ matrix.suite }}-${{ steps.image-key.outputs.key }}

      - name: Load cached dependency image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/celluloid-image-cache/image.tar ]; then
            docker load -i /tmp/celluloid-image-cache/image.tar
          fi

      - name: Show the resolved plan
        run: ./build.sh --list "${{ matrix.suite }}"

      - name: Build ${{ matrix.suite }}
        env:
          CONTAINER_ENGINE: docker
        run: |
          args=("${{ matrix.suite }}")
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          ./build.sh "${args[@]}"

      # Save the image after the build so the next run skips the apt step.
      - name: Save dependency image to cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          ref=$(docker images --format '{{.Repository}}:{{.Tag}}' \
                  | grep '^localhost/celluloid-build:' | head -1)
          if [ -n "$ref" ]; then
            mkdir -p /tmp/celluloid-image-cache
            docker save "$ref" -o /tmp/celluloid-image-cache/image.tar
          fi

      - name: Rename artifacts for clarity
        run: |
          mkdir -p out
          for f in dist/${{ matrix.suite }}/*.deb; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            # insert the suite name before the version, so the matrix jobs
            # never collide when several artifacts are downloaded together
            cp "$f" "out/${base%%_*}_${{ matrix.suite }}_${base#*_}"
          done
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: celluloid-${{ matrix.suite }}
          path: out/*.deb
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p packages
          find artifacts -name '*.deb' -exec cp {} packages/ \;
          ls -l packages

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly build' }}
          body: |
            Celluloid packages built from official upstream release tarballs.

            | Suite | Version |
            |---|---|
            | bookworm (12) | newest release buildable with GTK 4.8 / libadwaita 1.2 |
            | trixie (13) | newest release buildable with GTK 4.18 / libadwaita 1.7 |
            | sid | newest upstream release |

            Install with `sudo apt install ./<file>.deb`.
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
