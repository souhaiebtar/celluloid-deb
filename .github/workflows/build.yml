name: build packages

# Builds .deb packages for every supported suite, then publishes them to the
# repository's releases page.
#
#   push to a v* tag   -> a normal release for that tag
#   push to main, or a scheduled/manual run
#                      -> a rolling "nightly" pre-release, replaced each run
#   pull request       -> build only, nothing is published
#
# The rolling release is replaced rather than updated so artifacts from older
# upstream versions do not pile up as stale assets.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # weekly: picks up new upstream Celluloid releases without a commit
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      suites:
        description: "Space-separated suites (default: all)"
        required: false
        default: ""
      version:
        description: "Pin an upstream version, e.g. 0.30 (default: resolve)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  # Builds the private-prefix GTK 4.20 + libadwaita 1.8 packages that Debian 13
  # needs for Celluloid 0.30. Runs once and is shared by the trixie build, since
  # it takes ~10 minutes and does not depend on the Celluloid version.
  backports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg2 tar python3

      - name: Cache backport sources
        uses: actions/cache@v4
        with:
          path: build/backports/src
          key: backport-src-${{ hashFiles('backports.toml') }}

      - name: Build GTK + libadwaita backports
        env:
          CONTAINER_ENGINE: docker
        run: ./build-backports.sh

      - uses: actions/upload-artifact@v4
        with:
          name: celluloid-backports
          path: dist/backports/*.deb
          if-no-files-found: error

  build:
    needs: backports
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, sid]

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg2 tar python3

      # The trixie build needs the backports to reach Celluloid 0.30; other
      # suites ignore them. Downloading them here is cheaper than rebuilding.
      - name: Fetch backports
        uses: actions/download-artifact@v4
        with:
          name: celluloid-backports
          path: dist/backports

      # The build dependencies image is the expensive part of a run (~2.5 min of
      # apt per suite). Cache it between runs, keyed on the recipe that
      # produces it: the Dockerfile template, the dependency list and the
      # suite table. A change to any of those correctly misses the cache.
      - name: Compute dependency-image cache key
        id: image-key
        run: |
          key=$(cat packaging/Dockerfile.build.in suites.toml \
                  lib/container.sh | sha256sum | cut -c1-16)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore cached dependency image
        id: image-cache
        uses: actions/cache@v4
        with:
          path: /tmp/celluloid-image-cache
          key: celluloid-image-${{ matrix.suite }}-${{ steps.image-key.outputs.key }}

      - name: Load cached dependency image
        if: steps.image-cache.outputs.cache-hit == 'true'
        run: |
          if [ -f /tmp/celluloid-image-cache/image.tar ]; then
            docker load -i /tmp/celluloid-image-cache/image.tar
          fi

      - name: Show the resolved plan
        run: ./build.sh --list "${{ matrix.suite }}"

      - name: Build ${{ matrix.suite }}
        env:
          CONTAINER_ENGINE: docker
        run: |
          args=("${{ matrix.suite }}")
          if [ -n "${{ inputs.version }}" ]; then
            args+=(--version "${{ inputs.version }}")
          fi
          ./build.sh "${args[@]}"

      # Save the image after the build so the next run skips the apt step.
      - name: Save dependency image to cache
        if: steps.image-cache.outputs.cache-hit != 'true'
        run: |
          ref=$(docker images --format '{{.Repository}}:{{.Tag}}' \
                  | grep '^localhost/celluloid-build:' | head -1)
          if [ -n "$ref" ]; then
            mkdir -p /tmp/celluloid-image-cache
            docker save "$ref" -o /tmp/celluloid-image-cache/image.tar
          fi

      - name: Rename artifacts for clarity
        run: |
          mkdir -p out
          for f in dist/${{ matrix.suite }}/*.deb; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            # insert the suite name before the version, so the matrix jobs
            # never collide when several artifacts are downloaded together
            cp "$f" "out/${base%%_*}_${{ matrix.suite }}_${base#*_}"
          done
          ls -l out

      # Record the resolved version so the release notes can state what was
      # actually built rather than a guess. Derived from the package itself,
      # which is the authoritative answer.
      - name: Record built version
        run: |
          deb=$(ls out/*.deb | head -1)
          version=$(dpkg-deb -f "$deb" Version)
          printf '%s\t%s\n' "${{ matrix.suite }}" "$version" > out/version.tsv
          echo "built: ${{ matrix.suite }} $version"

      - uses: actions/upload-artifact@v4
        with:
          name: celluloid-${{ matrix.suite }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    # Publishing happens only from the default branch or a tag. Pull requests
    # and arbitrary branches are excluded on purpose: a fork's PR must not be
    # able to write assets into this repository.
    #
    # Partial success is enough: if one suite fails, the packages that did build
    # are still worth publishing, and the job below fails loudly if none exist.
    # Using needs.build.result == 'success' here would silently skip the release
    # whenever any single suite broke.
    if: |
      !cancelled() &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect packages and build release notes
        run: |
          mkdir -p packages
          find artifacts -name '*.deb' -exec cp {} packages/ \;

          if ! compgen -G "packages/*.deb" >/dev/null; then
            echo "no packages were produced by any suite; nothing to publish" >&2
            exit 1
          fi

          # The versions come from each build job, so the notes state what was
          # actually built rather than what was expected.
          echo "| Suite | Version | File |" > release-notes.md
          echo "|---|---|---|" >> release-notes.md
          for tsv in artifacts/celluloid-*/version.tsv; do
            [ -e "$tsv" ] || continue
            suite=$(cut -f1 "$tsv")
            version=$(cut -f2 "$tsv")
            file=$(basename "$(ls packages/*_"$suite"_*.deb | head -1)")
            printf '| %s | %s | `%s` |\n' "$suite" "$version" "$file" >> release-notes.md
          done

          # Note the backports explicitly: on trixie, Celluloid 0.30 needs them
          # and will refuse to install without them.
          if compgen -G "packages/*-backport_*.deb" >/dev/null; then
            cat >> release-notes.md <<'EOF'

          **Debian 13 users: install the backports too.** Celluloid 0.30 needs
          GTK >= 4.19.4 and libadwaita 1.8, which trixie does not ship. The
          `-backport` packages below provide them under `/opt/gtk420` without
          replacing the system GTK:

          ```sh
          sudo apt install ./*-backport_*.deb ./celluloid_*trixie*.deb
          ```
          EOF
          fi

          cat >> release-notes.md <<'EOF'

          Built from the official upstream Celluloid release tarballs, each in a
          container for the target Debian release so the binaries link against
          the libraries that release actually ships.

          Install with:

          ```sh
          sudo apt install ./<file>.deb
          ```

          These are unofficial local rebuilds, not Debian archive packages.
          EOF

          cat release-notes.md

      # A rolling release is deleted and recreated rather than updated: assets
      # from an older upstream version would otherwise linger as stale files
      # next to the current ones.
      #
      # Deletion is best-effort and retried: if it silently no-ops (as it did
      # once, leaving an old 0.29 asset next to the new 0.30 one), the publish
      # step below still replaces assets by name, so only assets that no longer
      # exist in this run are stale.
      - name: Remove previous nightly release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh release delete nightly --yes --cleanup-tag 2>/dev/null; then
              echo "removed previous nightly release"
              exit 0
            fi
            echo "attempt $attempt: nightly release not removed yet"
            sleep 2
          done
          echo "no previous nightly release, or it could not be removed; continuing"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          fail_on_unmatched_files: true
          # For a v* tag push the tag already exists, so it is reused as-is.
          # Otherwise publish a rolling pre-release named "nightly".
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly build' }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          make_latest: ${{ github.ref_type == 'tag' }}

